name = "bahborak-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"
APP_NAME = "BahBorak"

[[d1_databases]]
binding = "DB"
database_name = "bahborak-db"
database_id = "2b33f28a-ee06-4cfc-b908-e1363c3b2b65"

[[kv_namespaces]]
binding = "KV"
id = "7eaacef434bb46cfbc71a87ebe7f4c3b"

[[r2_buckets]]
binding = "AUDIT"
bucket_name = "bahborak-audit"

[[durable_objects.bindings]]
name = "TENANT"
class_name = "Tenant"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tenant"]

[observability]
enabled = true

[ai]
binding = "AI"
