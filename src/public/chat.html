<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BahBorak Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0c131a; color: #e9edef; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    .chat-container { flex: 1; overflow-y: auto; padding: 1em; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .me-sender { align-self: flex-end; background-color: #00a884; color: white; border-bottom-right-radius: 2px; }
    .them-sender { align-self: flex-start; background-color: #202c39; color: #f8fafc; border-bottom-left-radius: 2px; }
    .input-area { background-color: #111b21; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #222f3f; }
  </style>
</head>
<body class="font-sans">
  <!-- Header -->
  <div class="bg-[#111b21] p-4 flex justify-between items-center border-b border-[#222f3f]">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-xl">👤</div>
      <div>
        <div class="font-bold text-sm">Raksasa Kawan</div>
        <div class="text-xs text-green-400">Online</div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chat-box">
    <div class="text-center text-xs text-gray-500 my-4">🔕 End-to-End Encrypted.</div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Taip mesejj..." class="flex-1 bg-[#2a394a] text-white rounded-full px-4 py-3 outline-none">
    <button id="send-btn" class="bg-[#00a884] text-white rounded-full p-3 flex items-center justify-center hover:bg-green-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l-7-7m0 0l7-7m-7 7h14"/></svg>
    </button>
  </div>

  <script type="module">
    // 1. Keys dan Session
    const myUserId = "device-" + Math.random().toString(36).substring(2, 6);
    const roomId = "test-room";
    const wsUrl = `wss://${window.location.host}/ws/${roomId}?userId=${myUserId}`;

    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("msg-input");
    const btn = document.getElementById("send-btn");

    // 2. WebSocket Setup
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => console.log("✅ WebSocket connected");
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "message") {
        // Demo decrypt (menggunakan teks mentah sebab belum ada key sebenar di client)
        appendMessage(data.message.ciphertext, "them-sender"); 
      }
    };

    // 3. Fungsi Tambah Messaj ke UI
    function appendMessage(text, className) {
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 4. Hantar Messaj
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      
      // Append ke skreen sendiri (anggap tersendiri didekrip)
      appendMessage(text, "me-sender");
      input.value = "";

      // HANTAR ke API (kita hantar teks mentah sebagai ciphertext untuk demo)
      try {
        await fetch(`/api/conversations/${roomId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: "private",
            ciphertext: text, // Demo: supaya teks jadi ciphertext
            iv: "demo-iv",
            nonce: "demo-nonce",
            sender_pubkey: "demo-key"
          })
        });
      } catch (err) {
        console.error("Gagal hantar", err);
      }
    }

    btn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
