<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BahBorak</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #070b0f; color: #e2e8f0; height: 100dvh; }</style>
</head>
<body class="flex items-center justify-center p-6 relative">

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-teal-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="w-full max-w-md bg-[#0b1117]/90 border border-white/10 p-8 rounded-2xl shadow-2xl relative z-10 backdrop-blur-xl">
    <div class="flex flex-col items-center mb-6">
      <img src="/logo.jpg" alt="Logo" class="w-16 h-16 rounded-2xl mb-4 shadow-lg object-cover">
      <h2 class="text-2xl font-bold text-white" id="auth-title">Log Masuk</h2>
      <p class="text-gray-400 text-sm mt-1">Selamat kembali ke BahBorak</p>
    </div>

    
      <button type="button" onclick="handleGoogleAuth()" class="w-full flex items-center justify-center gap-3 bg-white text-black p-3.5 rounded-xl font-bold hover:bg-gray-200 transition mb-2">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
        Connect with Google
      </button>
      <div class="flex items-center my-4">
        <div class="flex-1 border-t border-white/10"></div>
        <span class="px-4 text-xs text-gray-500 uppercase">Atau</span>
        <div class="flex-1 border-t border-white/10"></div>
      </div>
<form id="auth-form" class="flex flex-col gap-4" onsubmit="handleAuth(event)">
      
      <!-- Field Signup (Hidden by default) -->
      <div id="signup-fields" class="hidden flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-gray-400 mb-1 block">NAMA PENUH</label>
          <input type="text" id="name" placeholder="Ali bin Abu" class="w-full bg-[#111b21] border border-white/10 p-3 rounded-xl outline-none focus:border-teal-400 text-white">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 mb-1 block">NAMA SYARIKAT</label>
          <input type="text" id="company" placeholder="Syarikat Sdn Bhd" class="w-full bg-[#111b21] border border-white/10 p-3 rounded-xl outline-none focus:border-teal-400 text-white">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-400 mb-1 block">NO. TELEFON</label>
          <input type="tel" id="phone" placeholder="0123456789" class="w-full bg-[#111b21] border border-white/10 p-3 rounded-xl outline-none focus:border-teal-400 text-white">
        </div>
      </div>

      <!-- Field Utama -->
      <div>
        <label class="text-xs font-semibold text-gray-400 mb-1 block">EMEL</label>
        <input type="email" id="email" placeholder="nama@bisnes.com" class="w-full bg-[#111b21] border border-white/10 p-3 rounded-xl outline-none focus:border-teal-400 text-white" required>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-400 mb-1 block">PASSWORD</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full bg-[#111b21] border border-white/10 p-3 rounded-xl outline-none focus:border-teal-400 text-white" required>
      </div>
      
      
      <div class="flex items-start gap-2 mt-2">
        <input type="checkbox" id="terms" required class="mt-1 accent-teal-500">
        <label for="terms" class="text-xs text-gray-400 leading-tight">Saya bersetuju dengan <a href="#" class="text-teal-400 hover:underline">Terma Perkhidmatan</a> dan <a href="#" class="text-teal-400 hover:underline">Dasar Privasi</a>.</label>
      </div>
<div id="error-msg" class="text-red-400 text-sm hidden"></div>

      <button type="submit" id="auth-btn" class="bg-gradient-to-r from-blue-600 to-teal-400 text-white p-3.5 rounded-xl font-bold mt-2 shadow-lg hover:opacity-90 transition">Log Masuk</button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
      <span id="toggle-text">Belum ada akaun?</span>
      <button onclick="toggleMode()" id="toggle-btn" class="text-teal-400 font-bold hover:underline ml-1">Daftar</button>
    </div>
  </div>

  <script>
    
    async function handleGoogleAuth() {
      // Nanti kita sambung ke Google OAuth sebenar di sini.
      // Buat masa ini, ia akan bagi amaran sebab Client ID belum masuk.
      alert("Google Auth: Sistem sedia untuk disambungkan. Sila masukkan Client ID di Cloudflare Secrets.");
    }

    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('auth-title').innerText = isLogin ? 'Log Masuk' : 'Daftar Akaun';
      document.getElementById('toggle-text').innerText = isLogin ? 'Belum ada akaun?' : 'Sudah ada akaun?';
      document.getElementById('toggle-btn').innerText = isLogin ? 'Daftar' : 'Log Masuk';
      document.getElementById('auth-btn').innerText = isLogin ? 'Log Masuk' : 'Daftar';
      document.getElementById('error-msg').classList.add('hidden');
      
      const fields = document.getElementById("signup-fields");
      if (isLogin) { 
        fields.classList.add("hidden"); fields.classList.remove("flex"); 
      } else { 
        fields.classList.remove("hidden"); fields.classList.add("flex"); 
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('auth-btn');
      const errBox = document.getElementById('error-msg');
      
      btn.innerText = 'Memproses...';
      btn.disabled = true;
      errBox.classList.add('hidden');

      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/signup';
      const payload = { email, password: pass };
      
      if (!isLogin) {
        payload.name = document.getElementById('name').value;
        payload.phone = document.getElementById('phone').value;
        payload.company_name = document.getElementById('company').value;
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Ralat berlaku');
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
        
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
        btn.innerText = isLogin ? 'Log Masuk' : 'Daftar';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
